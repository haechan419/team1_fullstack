# 데이터베이스 연결 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/smartspenddb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=smartspenduser
spring.datasource.password=smartspenduser
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 파일 저장 경로 (영수증 이미지)
file.upload.dir=./uploads/receipts
file.upload.url-prefix=/api/files/receipts

# 리포트 파일 저장 경로
report.file.dir=./uploads/reports
report.file.url-prefix=/api/files/reports

# 서버 포트
server.port=8080

# 정적 리소스 설정 (API 경로와 충돌 방지)
spring.web.resources.add-mappings=false

# JWT 설정
jwt.secret=smartspend-secret-key-for-jwt-token-generation-minimum-256-bits
jwt.expiration=86400


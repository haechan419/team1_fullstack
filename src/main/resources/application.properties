spring.application.name=full-stack1

# ===============================
# Datasource (MySQL)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/erp?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=malldbuser
spring.datasource.password=malldbuser

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Security / Logging
# ===============================
logging.level.org.springframework.security.web=TRACE

# ===============================
# File Upload (Multipart)
# ===============================
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB

# ===============================
# File Storage
# ===============================
com.mallapi.upload.path=upload
com.mallapi.report.storage-path=report-storage

# (?? ?? ??)
jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32BYTES_MIN
jwt.access-minutes=120
